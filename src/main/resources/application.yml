spring:
  application:
    name: gestao-projetos

  datasource:
    url: jdbc:postgresql://localhost:5432/GESTAO_PROJETOS
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    generate-ddl: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  spring-doc:
    paths-to-match: /gestao-projetos/**/**
    swagger-ui:
      use-root-path: true
api:
  membros:
    base-url: http://localhost:8081/membros-api

logging:
  level:
    root: INFO
    org.springframework: WARN
